<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="avatarBgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="55%" stop-color="#FFE3EC" />
      <stop offset="100%" stop-color="#FFCAD4" />
    </radialGradient>

    <!-- Hijab Outer Drape Gradient (Soft Dusty Blush Pink) -->
    <linearGradient id="hijabGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCD5CE" />
      <stop offset="40%" stop-color="#F8B4C4" />
      <stop offset="85%" stop-color="#E58E9F" />
      <stop offset="100%" stop-color="#C96B80" />
    </linearGradient>

    <!-- Hijab Inner Shadow / Fold Gradient -->
    <linearGradient id="hijabShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25971" />
      <stop offset="100%" stop-color="#9C3A50" />
    </linearGradient>

    <!-- Inner Ciput / Underscarf (Ivory / Soft Cream) -->
    <linearGradient id="ciputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7ECE1" />
    </linearGradient>

    <!-- Professional Blazer Gradient (Deep Plum / Charcoal Slate) -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#443247" />
      <stop offset="50%" stop-color="#322235" />
      <stop offset="100%" stop-color="#231726" />
    </linearGradient>

    <!-- Inner Shirt / Blouse Gradient (Soft White to Blush) -->
    <linearGradient id="blouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>

    <!-- Face Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEECE2" />
      <stop offset="60%" stop-color="#FBDBCF" />
      <stop offset="100%" stop-color="#F5C4B3" />
    </linearGradient>

    <!-- Soft Cheek Blush Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Round Portrait -->
    <clipPath id="avatarClip">
      <circle cx="200" cy="200" r="185" />
    </clipPath>
  </defs>

  <!-- Circular Outer Background Frame -->
  <circle cx="200" cy="200" r="188" fill="url(#avatarBgGrad)" stroke="#FB6F92" stroke-width="3.5" stroke-opacity="0.45" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 7" opacity="0.8" />

  <g clip-path="url(#avatarClip)">
    <!-- Soft Aura Glow behind avatar -->
    <circle cx="200" cy="150" r="125" fill="#FFFFFF" opacity="0.45" />

    <!-- ==================== HIJAB BACK / SILHOUETTE ==================== -->
    <path d="M125,180 C110,105 150,68 200,68 C250,68 290,105 275,180 C270,230 290,290 320,380 L80,380 C110,290 130,230 125,180 Z" fill="url(#hijabGrad)" />

    <!-- ==================== CLOTHING (PROFESSIONAL BLAZER) ==================== -->
    <!-- Shoulder & Blazer Body -->
    <path d="M75,380 C75,320 120,290 155,285 L200,340 L245,285 C280,290 325,320 325,380 Z" fill="url(#blazerGrad)" />
    
    <!-- Lapels of Blazer -->
    <path d="M155,285 L180,345 L165,380 L125,380 C115,350 130,310 155,285 Z" fill="#3D2B3F" />
    <path d="M245,285 L220,345 L235,380 L275,380 C285,350 270,310 245,285 Z" fill="#3D2B3F" />

    <!-- Inner Blouse -->
    <path d="M170,285 L200,340 L230,285 C215,290 185,290 170,285 Z" fill="url(#blouseGrad)" stroke="#F8B4C4" stroke-width="1" />

    <!-- ==================== HIJAB CHEST DRAPES ==================== -->
    <!-- Front Hijab Draping gracefully across neck & chest -->
    <path d="M142,225 C142,275 160,335 200,335 C240,335 258,275 258,225 C258,255 240,310 200,310 C160,310 142,255 142,225 Z" fill="url(#hijabShadow)" opacity="0.35" />
    <path d="M145,230 C145,280 165,325 200,325 C235,325 255,280 255,230 C250,265 232,295 200,295 C168,295 150,265 145,230 Z" fill="url(#hijabGrad)" />

    <!-- Soft folds on the chest drape -->
    <path d="M175,285 Q195,310 215,288" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4" />
    <path d="M185,295 Q200,312 210,298" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

    <!-- ==================== HIJAB FRAME & INNER CIPUT ==================== -->
    <!-- Hijab opening contour framing the face -->
    <path d="M138,185 C138,125 165,95 200,95 C235,95 262,125 262,185 C262,235 242,260 200,260 C158,260 138,235 138,185 Z" fill="url(#hijabGrad)" />

    <!-- Inner Ciput (Underscarf band at the forehead) -->
    <path d="M156,155 C160,130 178,118 200,118 C222,118 240,130 244,155 C232,142 216,136 200,136 C184,136 168,142 156,155 Z" fill="url(#ciputGrad)" stroke="#EAD5C3" stroke-width="0.8" />

    <!-- ==================== FACE ==================== -->
    <!-- Oval face visible through hijab -->
    <path d="M156,160 C156,220 174,248 200,248 C226,248 244,220 244,160 C244,142 225,138 200,138 C175,138 156,142 156,160 Z" fill="url(#skinGrad)" />

    <!-- Hijab inner shadow on face edges for natural depth -->
    <path d="M156,160 C156,142 175,138 200,138 C225,138 244,142 244,160 C238,148 220,143 200,143 C180,143 162,148 156,160 Z" fill="#C25971" opacity="0.18" />

    <!-- Cheek Blush (Soft Pink Glow) -->
    <ellipse cx="170" cy="204" rx="10" ry="7" fill="#FB6F92" opacity="0.35" filter="url(#softGlow)" />
    <ellipse cx="230" cy="204" rx="10" ry="7" fill="#FB6F92" opacity="0.35" filter="url(#softGlow)" />

    <!-- Eyebrows (Neat, natural, academic) -->
    <path d="M167,167 Q180,163 192,168" fill="none" stroke="#3D2924" stroke-width="2.2" stroke-linecap="round" />
    <path d="M208,168 Q220,163 233,167" fill="none" stroke="#3D2924" stroke-width="2.2" stroke-linecap="round" />

    <!-- Eyes (Friendly & intelligent) -->
    <ellipse cx="180" cy="179" rx="4.5" ry="4" fill="#2E1C18" />
    <circle cx="181.5" cy="177.5" r="1.5" fill="#FFFFFF" />
    <ellipse cx="220" cy="179" rx="4.5" ry="4" fill="#2E1C18" />
    <circle cx="221.5" cy="177.5" r="1.5" fill="#FFFFFF" />

    <!-- Subtle upper eyeliner curve -->
    <path d="M174,177 Q180,173 186,177" fill="none" stroke="#2E1C18" stroke-width="1.2" stroke-linecap="round" />
    <path d="M214,177 Q220,173 226,177" fill="none" stroke="#2E1C18" stroke-width="1.2" stroke-linecap="round" />

    <!-- ==================== EYEGLASSES (BERKACAMATA - ROSE GOLD / BROWN) ==================== -->
    <!-- Left Glass Frame -->
    <circle cx="179" cy="179" r="14.5" fill="none" stroke="#A75D43" stroke-width="2" />
    <circle cx="179" cy="179" r="13.2" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Left Glass Glare reflection -->
    <path d="M172,172 L182,170" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Right Glass Frame -->
    <circle cx="221" cy="179" r="14.5" fill="none" stroke="#A75D43" stroke-width="2" />
    <circle cx="221" cy="179" r="13.2" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Right Glass Glare reflection -->
    <path d="M214,172 L224,170" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Glasses Bridge over Nose -->
    <path d="M193.5,178 Q200,175 206.5,178" fill="none" stroke="#A75D43" stroke-width="2" stroke-linecap="round" />

    <!-- Glasses Temple Arms tucking gently into Hijab -->
    <path d="M164.5,178 L154,175" fill="none" stroke="#A75D43" stroke-width="1.8" stroke-linecap="round" />
    <path d="M235.5,178 L246,175" fill="none" stroke="#A75D43" stroke-width="1.8" stroke-linecap="round" />

    <!-- Nose Curve -->
    <path d="M198,187 Q200,199 203,199" fill="none" stroke="#DCA291" stroke-width="2" stroke-linecap="round" />

    <!-- Sweet Academic Smile (Soft Coral Rose Lips) -->
    <path d="M187,219 Q200,229 213,219" fill="none" stroke="#D1506D" stroke-width="2.5" stroke-linecap="round" />
    <path d="M189,220 Q200,227 211,220" fill="none" stroke="#FB6F92" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- ==================== DAISY FLOWER BROOCH ON HIJAB ==================== -->
    <!-- Beautiful daisy flower pin on the side of the hijab -->
    <g transform="translate(142, 230) scale(0.42)">
      <!-- Daisy Drop Shadow -->
      <circle cx="2" cy="3" r="14" fill="#9C3A50" opacity="0.3" filter="url(#softGlow)" />
      
      <!-- Daisy Petals -->
      <!-- Petal 1 --> <ellipse cx="0" cy="-24" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" />
      <!-- Petal 2 --> <ellipse cx="17" cy="-17" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" transform="rotate(45 17 -17)" />
      <!-- Petal 3 --> <ellipse cx="24" cy="0" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" transform="rotate(90 24 0)" />
      <!-- Petal 4 --> <ellipse cx="17" cy="17" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" transform="rotate(135 17 17)" />
      <!-- Petal 5 --> <ellipse cx="0" cy="24" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" />
      <!-- Petal 6 --> <ellipse cx="-17" cy="17" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" transform="rotate(225 -17 17)" />
      <!-- Petal 7 --> <ellipse cx="-24" cy="0" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" transform="rotate(270 -24 0)" />
      <!-- Petal 8 --> <ellipse cx="-17" cy="-17" rx="7" ry="14" fill="#FFFFFF" stroke="#FFEBF0" stroke-width="0.8" transform="rotate(315 -17 -17)" />

      <!-- Center Gold Stamen -->
      <circle cx="0" cy="0" r="11" fill="#FFC107" />
      <circle cx="0" cy="0" r="8" fill="#FFA000" />
      <circle cx="-2" cy="-2" r="3" fill="#FFE082" />
    </g>

    <!-- Small leaf accent beside the daisy brooch -->
    <path d="M130,222 C125,214 122,216 122,224 C122,230 128,232 134,228 Z" fill="#7FA99B" opacity="0.85" />

  </g>
</svg>