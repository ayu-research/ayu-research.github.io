<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <defs>
    <radialGradient id="centerGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="70%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC1BC" />
      <stop offset="100%" stop-color="#5E8B75" />
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFD6E0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#D9778F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Botanical leaves -->
  <path d="M120,90 Q90,30 40,40 Q60,75 120,90 Z" fill="url(#leafGrad)" opacity="0.85" />
  <path d="M120,90 Q150,20 200,30 Q180,75 120,90 Z" fill="url(#leafGrad)" opacity="0.85" />
  <path d="M110,110 Q70,140 30,120 Q55,95 110,110 Z" fill="url(#leafGrad)" opacity="0.8" />
  <path d="M130,110 Q170,150 210,130 Q180,95 130,110 Z" fill="url(#leafGrad)" opacity="0.8" />

  <!-- Main center daisy -->
  <g transform="translate(120,95) scale(0.9)" filter="url(#softShadow)">
    <!-- 12 petals -->
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(0)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(30)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(60)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(90)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(120)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(150)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(180)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(210)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(240)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(270)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(300)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(330)" />
    <circle cx="0" cy="0" r="15" fill="url(#centerGrad1)" stroke="#FFAA00" stroke-width="0.8" />
  </g>

  <!-- Smaller companion daisy left -->
  <g transform="translate(60,65) scale(0.55)" filter="url(#softShadow)">
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(0)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(40)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(80)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(120)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(160)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(200)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(240)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(280)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(320)" />
    <circle cx="0" cy="0" r="14" fill="url(#centerGrad1)" />
  </g>

  <!-- Smaller companion daisy right -->
  <g transform="translate(180,68) scale(0.58)" filter="url(#softShadow)">
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(15)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(55)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(95)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(135)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(175)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(215)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(255)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(295)" />
    <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad1)" transform="rotate(335)" />
    <circle cx="0" cy="0" r="14" fill="url(#centerGrad1)" />
  </g>
</svg>