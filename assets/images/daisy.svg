<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="daisyCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="70%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFD6E0" />
    </linearGradient>
    <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#E899AC" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Petals (12 petals rotated around center 50,50) -->
  <g filter="url(#petalShadow)">
    <g transform="translate(50,50)">
      <!-- Petal template rotated 12 times -->
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(0)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(30)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(60)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(90)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(120)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(150)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(180)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(210)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(240)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(270)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(300)" />
      <path d="M-6,-45 C-10,-40 -9,-15 0,-15 C9,-15 10,-40 6,-45 C3,-49 -3,-49 -6,-45 Z" fill="url(#petalGrad)" transform="rotate(330)" />
    </g>
  </g>
  <!-- Center disk -->
  <circle cx="50" cy="50" r="16" fill="url(#daisyCenterGrad)" stroke="#FFAA00" stroke-width="1" />
  <!-- Stamen textured dots -->
  <circle cx="48" cy="46" r="1.5" fill="#C85A17" opacity="0.8"/>
  <circle cx="53" cy="47" r="1.5" fill="#C85A17" opacity="0.8"/>
  <circle cx="50" cy="51" r="1.8" fill="#C85A17" opacity="0.9"/>
  <circle cx="46" cy="53" r="1.3" fill="#C85A17" opacity="0.7"/>
  <circle cx="54" cy="54" r="1.4" fill="#C85A17" opacity="0.8"/>
  <circle cx="50" cy="43" r="1.2" fill="#FFAA00" opacity="0.9"/>
  <circle cx="44" cy="48" r="1.2" fill="#FFAA00" opacity="0.9"/>
  <circle cx="56" cy="50" r="1.2" fill="#FFAA00" opacity="0.9"/>
</svg>